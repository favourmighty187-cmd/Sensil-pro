<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSI PRO Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07070b;color:#fff}
.container{max-width:900px;margin:auto;padding:25px 16px}
.card{background:#11121a;border:1px solid #292b38;border-radius:20px;padding:22px;margin-bottom:18px}
.purple{color:#7c5cff}
.muted{color:#a8a9b5}
h1{margin-bottom:6px}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:11px;border:1px solid #363847;background:#191b25;color:#fff;font-size:15px}
button{border:0;font-weight:bold;cursor:pointer}
.primary{background:#7c5cff}
.approve{background:#1f9d57}
.reject{background:#d64557}
.row{display:flex;gap:10px}
.hidden{display:none}
.empty{color:#a8a9b5;text-align:center;padding:20px}
.order{background:#191a24;border-radius:14px;padding:16px;margin-top:14px;line-height:1.7}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;background:#292b38}
.badge.approved{background:#1f9d57}
.badge.rejected{background:#d64557}
.proof{margin-top:10px}
.proof img,.proof video{max-width:100%;max-height:360px;border-radius:10px}
.error{color:#ff6677;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{width:auto;padding:10px 16px;margin:0}
</style>
</head>
<body>
<div class="container">

<div class="card" id="loginCard">
  <h1>SENSI <span class="purple">PRO</span> Admin</h1>
  <p class="muted">Enter your admin password.</p>
  <input id="password" type="password" placeholder="Admin password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Log in</button>
  <p class="error" id="loginError"></p>
</div>

<div class="hidden" id="panel">
  <div class="card">
    <div class="top">
      <div>
        <h1>Orders</h1>
        <p class="muted" id="count"></p>
      </div>
      <div class="row">
        <button class="primary" id="refreshBtn">Refresh</button>
        <button id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>
  <div id="orders"></div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);
let adminPassword = "";

function authHeaders(){
  return { "Authorization": "Bearer " + adminPassword };
}

/* LOGIN */
$("loginBtn").onclick = async () => {
  adminPassword = $("password").value;
  $("loginError").textContent = "";
  if(!adminPassword){ $("loginError").textContent = "Enter your password."; return; }

  try{
    const res = await fetch("/api/admin/orders", { headers: authHeaders() });
    if(res.status === 401){ $("loginError").textContent = "Wrong password."; return; }
    if(!res.ok){ $("loginError").textContent = "Server error. Try again."; return; }
    try{ sessionStorage.setItem("sp_admin", adminPassword); }catch(e){}
    $("loginCard").classList.add("hidden");
    $("panel").classList.remove("hidden");
    showOrders((await res.json()).orders);
  }catch(e){
    $("loginError").textContent = "Could not connect to server.";
  }
};
$("password").addEventListener("keydown", e => { if(e.key === "Enter") $("loginBtn").click(); });

$("logoutBtn").onclick = () => {
  try{ sessionStorage.removeItem("sp_admin"); }catch(e){}
  location.reload();
};
$("refreshBtn").onclick = loadOrders;

/* LOAD ORDERS */
async function loadOrders(){
  const box = $("orders");
  box.innerHTML = '<div class="empty">Loading...</div>';
  try{
    const res = await fetch("/api/admin/orders", { headers: authHeaders() });
    if(!res.ok){
      box.innerHTML = '<div class="empty">Session expired or unauthorized. Log out and log in again.</div>';
      return;
    }
    showOrders((await res.json()).orders);
  }catch(e){
    box.innerHTML = '<div class="empty">Could not connect to server.</div>';
  }
}

/* DISPLAY ORDERS */
function showOrders(orders){
  const box = $("orders");
  box.innerHTML = "";
  orders = orders || [];
  const pending = orders.filter(o => o.status === "pending").length;
  $("count").textContent = orders.length + " total, " + pending + " pending";

  if(orders.length === 0){
    box.innerHTML = '<div class="empty">No orders yet.</div>';
    return;
  }

  orders.forEach(order => {
    const div = document.createElement("div");
    div.className = "order";

    const info = document.createElement("div");
    const lines = [
      ["Name", order.name],
      ["Device", order.device],
      ["Date", new Date(order.createdAt).toLocaleString()],
      ["Order ID", order.id]
    ];
    lines.forEach(([label, value]) => {
      const p = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = label + ": ";
      p.appendChild(b);
      p.append(String(value));
      info.appendChild(p);
    });

    const badge = document.createElement("span");
    badge.className = "badge " + order.status;
    badge.textContent = order.status.toUpperCase();
    info.appendChild(badge);
    div.appendChild(info);

    /* proof */
    if(order.proofUrl){
      const proof = document.createElement("div");
      proof.className = "proof";
      const lower = order.proofUrl.toLowerCase();
      if(/\.(mp4|webm|mov|m4v|3gp)$/.test(lower)){
        const v = document.createElement("video");
        v.src = order.proofUrl;
        v.controls = true;
        proof.appendChild(v);
      }else{
        const img = document.createElement("img");
        img.src = order.proofUrl;
        img.alt = "Payment proof";
        proof.appendChild(img);
      }
      div.appendChild(proof);
    }

    /* buttons */
    if(order.status === "pending"){
      const row = document.createElement("div");
      row.className = "row";

      const approve = document.createElement("button");
      approve.className = "approve";
      approve.textContent = "Approve";
      approve.onclick = () => updateOrder(order.id, "approve", approve, reject);

      const reject = document.createElement("button");
      reject.className = "reject";
      reject.textContent = "Reject";
      reject.onclick = () => updateOrder(order.id, "reject", approve, reject);

      row.appendChild(approve);
      row.appendChild(reject);
      div.appendChild(row);
    }

    box.appendChild(div);
  });
}

/* APPROVE / REJECT */
async function updateOrder(id, action, b1, b2){
  b1.disabled = true; b2.disabled = true;
  try{
    const res = await fetch(
      "/api/admin/orders/" + encodeURIComponent(id) + "/" + action,
      { method: "POST", headers: authHeaders() }
    );
    if(!res.ok) throw new Error();
    loadOrders();
  }catch(e){
    alert("Could not update the order. Try again.");
    b1.disabled = false; b2.disabled = false;
  }
}

/* AUTO LOGIN IF SESSION EXISTS */
try{
  const saved = sessionStorage.getItem("sp_admin");
  if(saved){
    $("password").value = saved;
    $("loginBtn").click();
  }
}catch(e){}
</script>
</body>
</html>
