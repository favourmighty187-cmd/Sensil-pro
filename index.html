<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSI PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07070b;color:#fff;min-height:100vh}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden}
.glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle, rgba(124,92,255,.35), transparent 70%);top:-220px;left:50%;transform:translateX(-50%);pointer-events:none;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
.tag{color:#a8a9b5;font-size:14px;letter-spacing:1px;margin-bottom:18px;opacity:0;animation:fadeIn .6s ease forwards;animation-delay:.1s}
.logo{font-size:min(18vw,96px);font-weight:900;line-height:.95;letter-spacing:1px;opacity:0;animation:fadeIn .6s ease forwards;animation-delay:.25s}
.logo .pro{color:#7c5cff;display:block;font-size:min(20vw,110px);margin-top:-6px}
.sub{max-width:420px;color:#c7c8d3;font-size:17px;line-height:1.6;margin:26px 0 38px;opacity:0;animation:fadeIn .6s ease forwards;animation-delay:.45s}
.cta{display:inline-block;background:#7c5cff;color:#fff;font-size:18px;font-weight:bold;padding:18px 46px;border-radius:14px;text-decoration:none;box-shadow:0 12px 30px rgba(124,92,255,.4);opacity:0;animation:fadeIn .6s ease forwards,float 2.8s ease-in-out infinite;animation-delay:.65s,1.4s;transition:transform .15s ease}
.cta:active{transform:scale(.97)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.stats{display:flex;gap:28px;margin-top:48px;opacity:0;animation:fadeIn .6s ease forwards;animation-delay:.8s}
.stat b{display:block;font-size:24px;color:#7c5cff}
.stat span{font-size:12px;color:#80818d}
@media (prefers-reduced-motion: reduce){.glow,.cta{animation:fadeIn .01s linear forwards !important}}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <p class="tag">PREMIUM FREE FIRE SETTINGS</p>
  <div class="logo">SENSI<span class="pro">PRO</span></div>
  <p class="sub">Device-tuned sensitivity settings built to tighten your aim and speed up your reactions. Pick your device, get your numbers.</p>
  <a class="cta" href="device.html">Get Started</a>
  <div class="stats">
    <div class="stat"><b>19</b><span>devices supported</span></div>
    <div class="stat"><b>&#8358;800</b><span>one-time unlock</span></div>
  </div>
</div>
</body>
</html>BH
