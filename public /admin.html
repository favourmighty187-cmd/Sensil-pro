<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SENSI PRO — Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      color: #00ff88;
      text-shadow: 0 0 15px #00ff88;
    }

    .subtitle {
      color: #aaa;
      margin-top: 5px;
    }

    .card {
      background: #101010;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #080808;
      color: white;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      background: #00ff88;
      color: #000;
    }

    .logout-btn {
      background: #222;
      color: white;
      margin-bottom: 20px;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: #080808;
      border: 1px solid #252525;
      border-radius: 15px;
      padding: 18px;
    }

    .order-id {
      color: #00ff88;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      margin: 7px 0;
      color: #ccc;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin: 8px 0;
    }

    .pending {
      background: #3b3200;
      color: #ffd900;
    }

    .approved {
      background: #003d22;
      color: #00ff88;
    }

    .rejected {
      background: #3d0000;
      color: #ff5555;
    }

    .proof {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      background: #000;
      border-radius: 10px;
      margin: 12px 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .approve {
      background: #00ff88;
      color: #000;
      flex: 1;
    }

    .reject {
      background: #ff3333;
      color: white;
      flex: 1;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      background: #151515;
      color: #aaa;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">SENSI PRO</div>
    <div class="subtitle">Admin Payment Dashboard</div>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>🔐 Admin Login</h2>

    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      LOGIN
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

    <div class="card">

      <h2>💳 Payment Orders</h2>

      <button
        class="login-btn"
        onclick="loadOrders()"
      >
        🔄 Refresh Orders
      </button>

      <div id="orders" class="orders">
        <div class="empty">
          Loading orders...
        </div>
      </div>

    </div>

  </div>

</div>


<script>

let adminPassword = "";


/* LOGIN */

async function login() {

  const password =
    document.getElementById("password").value.trim();

  if (!password) {

    document.getElementById("loginMessage").innerHTML =
      '<div class="message">Enter your password.</div>';

    return;
  }

  adminPassword = password;

  try {

    const response = await fetch(
      "/api/admin/orders",
      {
        headers: {
          "Authorization":
            "Bearer " + adminPassword
        }
      }
    );

    if (!response.ok) {

      adminPassword = "";

      document.getElementById("loginMessage").innerHTML =
        '<div class="message">❌ Incorrect password.</div>';

      return;
    }

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    displayOrders(
      await response.json()
    );

  } catch (error) {

    document.getElementById("loginMessage").innerHTML =
      '<div class="message">Server connection failed.</div>';

  }
}


/* LOAD ORDERS */

async function loadOrders() {

  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML =
    '<div class="empty">Loading...</div>';

  try {

    const response = await fetch(
      "/api/admin/orders",
      {
        headers: {
          "Authorization":
            "Bearer " + adminPassword
        }
      }
    );

    if (!response.ok) {

      ordersBox.innerHTML =
        '<div class="empty">Session expired or unauthorized.</div>';

      return;
    }

    const data =
      await response.json();

    displayOrders(data);

  } catch (error) {

    ordersBox.innerHTML =
      '<div class="empty">Could not connect to server.</div>';

  }
}


/* DISPLAY ORDERS */

  const ordersBox =

    return;
  }
