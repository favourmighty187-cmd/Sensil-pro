<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your device — SENSI PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07070b;color:#fff}
.container{max-width:900px;margin:auto;padding:25px 16px 110px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.back{width:40px;height:40px;border-radius:50%;background:#191b25;border:1px solid #333646;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:18px;flex-shrink:0}
.step{color:#a8a9b5;font-size:13px}
.card{background:#11121a;border:1px solid #292b38;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
h2{margin-bottom:15px}
.devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.device{padding:15px;background:#191b25;border:1px solid #333646;border-radius:12px;cursor:pointer;text-align:center;transition:.2s;color:#fff;font-size:15px}
.device:hover{transform:translateY(-2px)}
.device.active{border-color:#7c5cff;background:#211b3d}
.price{font-size:38px;font-weight:900;margin:10px 0 15px}
.payment{background:#191a24;padding:17px;border-radius:12px;line-height:1.9}
.muted{color:#a8a9b5}
.next{position:fixed;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(to top, #07070b 60%, transparent)}
.next button{max-width:900px;margin:auto;display:block;width:100%;padding:16px;border-radius:12px;border:0;background:#7c5cff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.next button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="container">

  <div class="top">
    <a class="back" href="index.html" aria-label="Back">&#8592;</a>
    <span class="step">Step 1 of 2</span>
  </div>

  <div class="card">
    <h2>Choose your device</h2>
    <p class="muted" style="margin-bottom:15px">Your sensitivity numbers are tuned per device.</p>
    <div class="devices" id="devices"></div>
  </div>

  <div class="card">
    <h2>Payment</h2>
    <div class="price">&#8358;800</div>
    <div class="payment">
      <b>Payment Method:</b> OPay<br>
      <b>Account Name:</b> MIGHTY FAVOUR<br>
      <b>Account Number:</b> 7013342843
    </div>
  </div>

</div>

<div class="next">
  <button id="continueBtn" disabled>I've Paid — Continue</button>
</div>

<script>
const devices = [
  "Oppo A53","Oppo F1s","Oppo F19","Tecno Spark 20C","Samsung A12","Samsung A13",
  "Samsung A14","Samsung A15","iPhone 11","iPhone 12","iPhone 13","Redmi Note 10",
  "Redmi Note 12","Infinix Hot 12","Infinix Hot 30","Tecno Camon 20","Tecno Camon 30",
  "Vivo Y20","Other"
];
const box = document.getElementById("devices");
const continueBtn = document.getElementById("continueBtn");
let selected = "";
try { selected = sessionStorage.getItem("sp_device") || ""; } catch(e){}

devices.forEach(device => {
  const el = document.createElement("div");
  el.className = "device" + (device === selected ? " active" : "");
  el.textContent = device;
  el.onclick = () => {
    document.querySelectorAll(".device").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    selected = device;
    continueBtn.disabled = false;
  };
  box.appendChild(el);
});
if (selected) continueBtn.disabled = false;

continueBtn.onclick = () => {
  if (!selected) return;
  try { sessionStorage.setItem("sp_device", selected); } catch(e){}
  location.href = "upload.html";
};
</script>
</body>
</html>
